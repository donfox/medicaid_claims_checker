<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <!-- Gradients -->
    <linearGradient id="inputGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#388E3C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="parserGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1565C0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="syntaxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9C27B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6A1B9A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="engineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E65100;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="evalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00BCD4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00838F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="typesGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#607D8B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#37474F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="outputGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F44336;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C62828;stop-opacity:1" />
    </linearGradient>

    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowheadBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1565C0"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="#fafafa"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333">
    JSON Claims Integrity DSL Evaluation Architecture
  </text>
  <text x="600" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666">
    Module flow (JSON-first runtime)
  </text>

  <!-- ==================== INPUT LAYER ==================== -->
  <text x="80" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">INPUT</text>

  <!-- Rules Text Input -->
  <rect x="50" y="130" width="200" height="100" rx="8" fill="url(#inputGrad)" stroke="#2E7D32" stroke-width="2"/>
  <text x="150" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">DSL Rules Text</text>
  <text x="150" y="180" text-anchor="middle" font-family="monospace" font-size="10" fill="white">RULE high_amount</text>
  <text x="150" y="195" text-anchor="middle" font-family="monospace" font-size="10" fill="white">WHEN CLM.amount > 10000</text>
  <text x="150" y="210" text-anchor="middle" font-family="monospace" font-size="10" fill="white">THEN FLAG_FRAUD "..."</text>

  <!-- JSON Claim Input -->
  <rect x="50" y="260" width="200" height="100" rx="8" fill="url(#inputGrad)" stroke="#2E7D32" stroke-width="2"/>
  <text x="150" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">JSON Claim Document</text>
  <text x="150" y="310" text-anchor="middle" font-family="monospace" font-size="10" fill="white">{"CLM": {"amount": 15000,</text>
  <text x="150" y="325" text-anchor="middle" font-family="monospace" font-size="10" fill="white">  "provider": "NPI123"},</text>
  <text x="150" y="340" text-anchor="middle" font-family="monospace" font-size="10" fill="white"> "service_lines": [...]}</text>

  <!-- ==================== PARSER MODULE ==================== -->
  <text x="350" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">PARSER</text>

  <rect x="300" y="130" width="180" height="120" rx="8" fill="url(#parserGrad)" stroke="#0D47A1" stroke-width="2"/>
  <text x="390" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Parser.hs</text>
  <line x1="320" y1="165" x2="460" y2="165" stroke="white" stroke-opacity="0.5"/>
  <text x="390" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">parseRule :: Text</text>
  <text x="390" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">  → Either ParseError Rule</text>
  <text x="390" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">parseRules :: Text</text>
  <text x="390" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">  → Either ParseError [Rule]</text>

  <!-- ==================== SYNTAX MODULE (AST) ==================== -->
  <text x="570" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">AST TYPES</text>

  <rect x="530" y="130" width="200" height="230" rx="8" fill="url(#syntaxGrad)" stroke="#4A148C" stroke-width="2"/>
  <text x="630" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Syntax.hs</text>
  <line x1="550" y1="165" x2="710" y2="165" stroke="white" stroke-opacity="0.5"/>

  <!-- Rule type -->
  <text x="550" y="185" font-family="monospace" font-size="10" fill="white">data Rule = Rule</text>
  <text x="560" y="198" font-family="monospace" font-size="9" fill="#E1BEE7">{ ruleName, ruleCondition,</text>
  <text x="560" y="210" font-family="monospace" font-size="9" fill="#E1BEE7">  ruleBindings, ruleAction, ... }</text>

  <!-- Predicate type -->
  <text x="550" y="230" font-family="monospace" font-size="10" fill="white">data Predicate =</text>
  <text x="560" y="243" font-family="monospace" font-size="9" fill="#E1BEE7">Equals | GreaterThan | And |</text>
  <text x="560" y="255" font-family="monospace" font-size="9" fill="#E1BEE7">Or | Not | Exists | ForAll | ...</text>

  <!-- FieldRef type -->
  <text x="550" y="275" font-family="monospace" font-size="10" fill="white">data FieldRef =</text>
  <text x="560" y="288" font-family="monospace" font-size="9" fill="#E1BEE7">Field | SegmentField |</text>
  <text x="560" y="300" font-family="monospace" font-size="9" fill="#E1BEE7">LoopField | ElementPosition</text>

  <!-- Action type -->
  <text x="550" y="320" font-family="monospace" font-size="10" fill="white">data Action =</text>
  <text x="560" y="333" font-family="monospace" font-size="9" fill="#E1BEE7">FlagFraud | AssignRiskScore |</text>
  <text x="560" y="345" font-family="monospace" font-size="9" fill="#E1BEE7">RequireReview | RejectClaim</text>

  <!-- ==================== RULE ENGINE ==================== -->
  <text x="820" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">ORCHESTRATION</text>

  <rect x="780" y="130" width="200" height="150" rx="8" fill="url(#engineGrad)" stroke="#BF360C" stroke-width="2"/>
  <text x="880" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">RuleEngine.hs</text>
  <line x1="800" y1="165" x2="960" y2="165" stroke="white" stroke-opacity="0.5"/>

  <text x="880" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">loadRules :: Text</text>
  <text x="880" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">  → Either String RuleEngine</text>
  <text x="880" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">evaluateDocument ::</text>
  <text x="880" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">  RuleEngine → X12Document</text>
  <text x="880" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">  → EvaluationReport</text>
  <text x="880" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">evaluateSimpleJson :: RuleEngine → Aeson.Value</text>

  <!-- ==================== EVALUATORS ==================== -->
  <text x="550" y="400" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">EVALUATORS</text>

  <!-- Evaluator.hs -->
  <rect x="400" y="420" width="200" height="140" rx="8" fill="url(#evalGrad)" stroke="#006064" stroke-width="2"/>
  <text x="500" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Evaluator.hs</text>
  <text x="500" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#B2EBF2">(Legacy typed evaluation path)</text>
  <line x1="420" y1="470" x2="580" y2="470" stroke="white" stroke-opacity="0.5"/>
  <text x="500" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">evaluatePredicate ::</text>
  <text x="500" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">  X12Document → Predicate</text>
  <text x="500" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">  → Bool</text>
  <text x="500" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">evaluateRule :: ... → RuleResult</text>

  <!-- SimpleEvaluator.hs -->
  <rect x="650" y="420" width="200" height="140" rx="8" fill="url(#evalGrad)" stroke="#006064" stroke-width="2"/>
  <text x="750" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">SimpleEvaluator.hs</text>
  <text x="750" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#B2EBF2">(Generic JSON evaluation)</text>
  <line x1="670" y1="470" x2="830" y2="470" stroke="white" stroke-opacity="0.5"/>
  <text x="750" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">evaluatePredicateSimple ::</text>
  <text x="750" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">  Aeson.Value → Predicate</text>
  <text x="750" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">  → Bool</text>
  <text x="750" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">lookupJsonField :: FieldRef → ...</text>

  <!-- ==================== X12TYPES MODULE ==================== -->
  <text x="100" y="400" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">LEGACY TYPES</text>

  <rect x="50" y="420" width="200" height="200" rx="8" fill="url(#typesGrad)" stroke="#263238" stroke-width="2"/>
  <text x="150" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">X12Types.hs</text>
  <line x1="70" y1="455" x2="230" y2="455" stroke="white" stroke-opacity="0.5"/>

  <text x="60" y="475" font-family="monospace" font-size="10" fill="white">data X12Document</text>
  <text x="70" y="488" font-family="monospace" font-size="9" fill="#B0BEC5">{ docInterchanges }</text>

  <text x="60" y="508" font-family="monospace" font-size="10" fill="white">data Transaction</text>
  <text x="70" y="521" font-family="monospace" font-size="9" fill="#B0BEC5">{ txLoops :: Map Text [Loop] }</text>

  <text x="60" y="541" font-family="monospace" font-size="10" fill="white">data Loop</text>
  <text x="70" y="554" font-family="monospace" font-size="9" fill="#B0BEC5">{ loopId, loopSegments }</text>

  <text x="60" y="574" font-family="monospace" font-size="10" fill="white">data RuleResult</text>
  <text x="70" y="587" font-family="monospace" font-size="9" fill="#B0BEC5">{ resultRuleName,</text>
  <text x="70" y="600" font-family="monospace" font-size="9" fill="#B0BEC5">  resultMatched, resultAction }</text>

  <!-- ==================== OUTPUT ==================== -->
  <text x="980" y="400" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">OUTPUT</text>

  <rect x="930" y="420" width="220" height="140" rx="8" fill="url(#outputGrad)" stroke="#B71C1C" stroke-width="2"/>
  <text x="1040" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">EvaluationReport</text>
  <line x1="950" y1="455" x2="1130" y2="455" stroke="white" stroke-opacity="0.5"/>
  <text x="960" y="475" font-family="monospace" font-size="10" fill="white">reportResults :: [RuleResult]</text>
  <text x="960" y="492" font-family="monospace" font-size="10" fill="white">reportTotalRules :: Int</text>
  <text x="960" y="509" font-family="monospace" font-size="10" fill="white">reportMatchedRules :: Int</text>
  <text x="960" y="526" font-family="monospace" font-size="10" fill="white">reportOverallRisk :: RiskLevel</text>
  <text x="960" y="543" font-family="monospace" font-size="10" fill="white">reportSummary :: Text</text>

  <!-- ==================== FLOW ARROWS ==================== -->

  <!-- Rules Text → Parser -->
  <path d="M 250 180 L 295 180" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="272" y="170" font-family="Arial, sans-serif" font-size="9" fill="#666">1</text>

  <!-- Parser → Syntax (produces AST) -->
  <path d="M 480 190 L 525 190" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="502" y="180" font-family="Arial, sans-serif" font-size="9" fill="#666">2</text>

  <!-- Syntax → RuleEngine (AST used by engine) -->
  <path d="M 730 200 L 775 200" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="752" y="190" font-family="Arial, sans-serif" font-size="9" fill="#666">3</text>

  <!-- RuleEngine → Evaluators -->
  <path d="M 880 280 L 880 350 L 625 350 L 625 415" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="890" y="330" font-family="Arial, sans-serif" font-size="9" fill="#666">4a</text>

  <path d="M 880 280 L 880 350 L 750 350 L 750 415" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="760" y="400" font-family="Arial, sans-serif" font-size="9" fill="#666">4b</text>

  <!-- JSON Claim → Evaluators -->
  <path d="M 250 310 L 330 310 L 330 490 L 395 490" stroke="#4CAF50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="340" y="400" font-family="Arial, sans-serif" font-size="9" fill="#4CAF50">JSON</text>

  <path d="M 250 310 L 330 310 L 330 490 L 645 490" stroke="#4CAF50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Evaluators → X12Types (uses types) -->
  <path d="M 400 500 L 255 500" stroke="#607D8B" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="310" y="490" font-family="Arial, sans-serif" font-size="9" fill="#607D8B">uses types</text>

  <!-- Evaluators → Output -->
  <path d="M 600 560 L 620 580 L 920 580 L 920 490 L 925 490" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="770" y="570" font-family="Arial, sans-serif" font-size="9" fill="#666">5</text>

  <path d="M 850 560 L 870 580 L 920 580 L 920 490 L 925 490" stroke="#333" stroke-width="2" fill="none"/>

  <!-- ==================== EVALUATION FLOW DETAIL BOX ==================== -->
  <rect x="50" y="660" width="1100" height="220" rx="10" fill="white" stroke="#ddd" stroke-width="2"/>
  <text x="600" y="690" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Predicate Evaluation Flow (evaluatePredicate*)</text>

  <!-- Step boxes -->
  <rect x="80" y="720" width="150" height="60" rx="5" fill="#E3F2FD" stroke="#1976D2" stroke-width="1"/>
  <text x="155" y="745" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1565C0">1. Pattern Match</text>
  <text x="155" y="765" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">on Predicate type</text>

  <rect x="280" y="720" width="150" height="60" rx="5" fill="#E8F5E9" stroke="#388E3C" stroke-width="1"/>
  <text x="355" y="745" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2E7D32">2. Field Lookup</text>
  <text x="355" y="765" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">lookupJsonField / lookupField</text>

  <rect x="480" y="720" width="150" height="60" rx="5" fill="#FFF3E0" stroke="#E65100" stroke-width="1"/>
  <text x="555" y="745" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#E65100">3. Compare</text>
  <text x="555" y="765" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">compareField/Numeric</text>

  <rect x="680" y="720" width="150" height="60" rx="5" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1"/>
  <text x="755" y="745" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#7B1FA2">4. Combine</text>
  <text x="755" y="765" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">And/Or/Not logic</text>

  <rect x="880" y="720" width="150" height="60" rx="5" fill="#FFEBEE" stroke="#C62828" stroke-width="1"/>
  <text x="955" y="745" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#C62828">5. Return Bool</text>
  <text x="955" y="765" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">match/no match</text>

  <!-- Arrows between steps -->
  <path d="M 230 750 L 275 750" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 430 750 L 475 750" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 630 750 L 675 750" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 830 750 L 875 750" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Example predicates -->
  <text x="80" y="810" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Common Predicates:</text>
  <text x="80" y="830" font-family="monospace" font-size="10" fill="#555">Equals | NotEquals | GreaterThan | LessThan | Contains | Matches | HelperCall</text>
  <text x="80" y="850" font-family="monospace" font-size="10" fill="#555">And | Or | Not | Exists (quantified) | ForAll (quantified) | Count</text>

  <!-- Legend -->
  <rect x="750" y="800" width="380" height="65" rx="5" fill="#f5f5f5" stroke="#ddd"/>
  <text x="770" y="820" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">Legend:</text>
  <line x1="770" y1="840" x2="800" y2="840" stroke="#4CAF50" stroke-width="2"/>
  <text x="810" y="844" font-family="Arial, sans-serif" font-size="10" fill="#333">JSON data flow</text>
  <line x1="900" y1="840" x2="930" y2="840" stroke="#333" stroke-width="2"/>
  <text x="940" y="844" font-family="Arial, sans-serif" font-size="10" fill="#333">Processing flow</text>
  <line x1="1020" y1="840" x2="1050" y2="840" stroke="#607D8B" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="1060" y="844" font-family="Arial, sans-serif" font-size="10" fill="#333">Type dependency</text>
</svg>
